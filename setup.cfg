[flake8]
ignore =
    W503,
    D104,
    D106
exclude =
    */venv/,
    venv/,
    */env/,
    */migrations/,
    data/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501,D100

[isort]
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 79
known_first_party = api,recipes,users,foodgram
src_paths = backend