volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: aliases2/foodgram_backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on:
      - db
    restart: always

  frontend:
    image: aliases2/foodgram_frontend
    volumes:
      - static:/frontend_static

  gateway:
    image: aliases2/foodgram_gateway
    ports:
      - 9090:80
    volumes:
      - static:/staticfiles
      - media:/media
    depends_on:
      - backend
    restart: always
